[package]
name = "poryadok-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Порядок — окно-визитка, которое раскладывает файлы по полкам"

[[bin]]
name = "poryadok-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
poryadok-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

