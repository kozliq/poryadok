[package]
name = "poryadok-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Раскладывает файлы по папкам: по типу и по словам в названии. Ничего не удаляет, всё можно откатить."

[lib]
name = "poryadok"

[[bin]]
name = "poryadok"
path = "src/bin/poryadok.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Распознавание текста на картинках — встроенное в систему, без установки.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
