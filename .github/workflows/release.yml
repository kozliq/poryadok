name: Выпуск

# Новая версия: git tag v0.1.0 && git push --tags — через ~15 минут на странице Releases
# появится черновик с установщиками для Windows и обоих видов Маков.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Порядок ${{ github.ref_name }}
          releaseBody: Скачайте файл для своей системы ниже. Как открыть неподписанную программу — в README.
          releaseDraft: true
          # Русское имя программы в названии файла GitHub превращает в пустоту.
          assetNamePattern: Poryadok_[version]_[arch][setup][ext]
          args: --target ${{ matrix.target }}
